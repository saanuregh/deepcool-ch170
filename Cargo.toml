[package]
name = "deepcool-ch170"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "~1.0"
hidapi = { version = "~2.6", default-features = false, features = [
  "windows-native",
] }
# Held at 0.8 (not the newer 0.9) to share nvml-wrapper-sys's copy; 0.9 would
# pull a second libloading into the build.
libloading = "~0.8"
log = "~0.4"
# default features are empty (serde / legacy-functions are opt-in).
nvml-wrapper = "~0.12"
windows = { version = "~0.62", features = [
  "Win32_Foundation",
  # Win32_Graphics_Gdi: WNDCLASSW/RegisterClassW reference HBRUSH.
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  "Win32_UI_WindowsAndMessaging",
] }
zerocopy = { version = "~0.8", features = ["derive"] }

[build-dependencies]
embed-manifest = "~1.5"

[profile.release]
opt-level = "z"     # optimize for size (this app is I/O-bound, not CPU-bound)
lto = true          # cross-crate dead-code elimination
codegen-units = 1   # better optimization / smaller output
panic = "abort"     # drop unwinding tables
strip = true        # strip symbols
